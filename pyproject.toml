[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flock-blocker"
version = "0.1.0"
description = "Multi-agent privacy awareness tool for publicly reported ALPR / Flock camera locations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.2.76",
  "langchain>=0.3.14",
  "langchain-core>=0.3.28",
  "langchain-openai>=0.3.0",
  "langchain-anthropic>=0.3.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "httpx>=0.27.0",
  "ddgs>=9.0.0",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]

[project.scripts]
flock-blocker = "flock_blocker.cli:main"

[tool.setuptools.packages.find]
include = ["flock_blocker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
